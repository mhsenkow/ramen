name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            preset: macOS
            lib_name: librama_sim.dylib
            artifact: RamaCycle-macos.zip
            out_name: RamaCycle.zip
          - os: ubuntu-latest
            platform: linux
            preset: Linux
            lib_name: librama_sim.so
            artifact: RamaCycle-linux.zip
            out_name: RamaCycle.x86_64
          - os: ubuntu-latest
            platform: deck
            preset: Steam Deck (Linux)
            lib_name: librama_sim.so
            artifact: RamaCycle-deck.zip
            out_name: RamaCycle.x86_64
          - os: ubuntu-latest
            platform: lowspec
            preset: Low Spec (Linux)
            lib_name: librama_sim.so
            artifact: RamaCycle-lowspec.zip
            out_name: RamaCycle.x86_64
          - os: windows-latest
            platform: windows
            preset: Windows Desktop
            lib_name: rama_sim.dll
            artifact: RamaCycle-windows.zip
            out_name: RamaCycle.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build simulation core
        working-directory: sim
        run: cargo build --release --lib

      - name: Install native library
        run: |
          mkdir -p game/bin
          case "${{ matrix.platform }}" in
            macos)
              cp sim/target/release/librama_sim.dylib "game/bin/${{ matrix.lib_name }}"
              codesign --force --sign - "game/bin/${{ matrix.lib_name }}"
              ;;
            linux|deck|lowspec)
              cp sim/target/release/librama_sim.so "game/bin/${{ matrix.lib_name }}"
              ;;
            windows)
              cp sim/target/release/rama_sim.dll "game/bin/${{ matrix.lib_name }}"
              ;;
          esac
          ls -la game/bin/

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Export ${{ matrix.platform }}
        run: |
          OUT_DIR="${GITHUB_WORKSPACE}/dist/${{ matrix.platform }}"
          mkdir -p "$OUT_DIR"
          OUT="${OUT_DIR}/${{ matrix.out_name }}"
          set +e
          godot --headless --path game --export-release "${{ matrix.preset }}" "$OUT"
          status=$?
          set -e
          ls -laR "${GITHUB_WORKSPACE}/dist/" || true
          # Godot 4.6 sometimes SIGSEGVs on exit after a successful GDExtension export.
          if [ -f "$OUT" ] || [ -f "${OUT}.zip" ] || compgen -G "${OUT_DIR}/*" > /dev/null; then
            echo "Export artifacts present (godot exit=${status})"
            exit 0
          fi
          echo "Export produced no artifacts (godot exit=${status})"
          exit 1

      - name: Sign and notarize macOS
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/rama-mac"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          ZIP="dist/macos/${{ matrix.out_name }}"
          # Godot may write RamaCycle.zip or RamaCycle.zip.zip depending on template.
          if [[ ! -f "$ZIP" && -f "${ZIP}.zip" ]]; then ZIP="${ZIP}.zip"; fi
          unzip -q "$ZIP" -d "$WORK"
          APP="$(find "$WORK" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "No .app inside $ZIP" >&2
            ls -laR "$WORK" >&2
            exit 1
          fi
          if [[ -n "${MACOS_CERTIFICATE:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            bash scripts/import_macos_signing_cert.sh
            bash scripts/sign_macos_app.sh "$APP"
            if [[ ( -n "${NOTARY_API_KEY:-}" && -n "${NOTARY_API_KEY_ID:-}" && -n "${NOTARY_API_ISSUER:-}" ) \
               || ( -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ) ]]; then
              bash scripts/notarize_macos_app.sh "$APP"
            else
              echo "Signed but skipping notarization — add NOTARY_* or APPLE_ID secrets."
            fi
          else
            echo "Skipping Developer ID sign/notarize — add MACOS_CERTIFICATE secrets (see scripts/export_macos_cert_for_ci.sh)."
            # Ad-hoc re-sign nested dylib so Gatekeeper at least sees a coherent signature.
            codesign --force --deep --sign - "$APP" || true
          fi
          # Bundle first-run helpers beside the .app
          cp packaging/FIRST_RUN.txt "$WORK/"
          cp "packaging/Open RAMA CYCLE.command" "$WORK/"
          chmod +x "$WORK/Open RAMA CYCLE.command"
          mkdir -p package-stage
          (cd "$WORK" && zip -9 -r "$GITHUB_WORKSPACE/package-stage/${{ matrix.artifact }}" .)
          echo "MAC_PACKAGE=$GITHUB_WORKSPACE/package-stage/${{ matrix.artifact }}" >> "$GITHUB_ENV"

      - name: Package artifact
        run: |
          mkdir -p package
          case "${{ matrix.platform }}" in
            macos)
              if [[ -f "${MAC_PACKAGE:-}" ]]; then
                cp "$MAC_PACKAGE" "package/${{ matrix.artifact }}"
              elif [[ -f package-stage/${{ matrix.artifact }} ]]; then
                cp "package-stage/${{ matrix.artifact }}" "package/${{ matrix.artifact }}"
              else
                # Fallback: raw Godot zip + helpers
                WORK="$RUNNER_TEMP/rama-mac-fallback"
                rm -rf "$WORK" && mkdir -p "$WORK"
                unzip -q "dist/macos/${{ matrix.out_name }}" -d "$WORK"
                cp packaging/FIRST_RUN.txt "$WORK/"
                cp "packaging/Open RAMA CYCLE.command" "$WORK/"
                chmod +x "$WORK/Open RAMA CYCLE.command"
                (cd "$WORK" && zip -9 -r "$GITHUB_WORKSPACE/package/${{ matrix.artifact }}" .)
              fi
              ;;
            linux|deck|lowspec)
              (
                cd "dist/${{ matrix.platform }}"
                cp "$GITHUB_WORKSPACE/packaging/FIRST_RUN.txt" .
                cp "$GITHUB_WORKSPACE/packaging/Run RAMA CYCLE.sh" .
                chmod +x "Run RAMA CYCLE.sh" RamaCycle.x86_64 2>/dev/null || chmod +x "Run RAMA CYCLE.sh"
                zip -9 "../../package/${{ matrix.artifact }}" *
              )
              ;;
            windows)
              (
                cd dist/windows
                cp "$GITHUB_WORKSPACE/packaging/FIRST_RUN.txt" .
                if command -v zip >/dev/null 2>&1; then
                  zip -9 "../../package/${{ matrix.artifact }}" *
                else
                  7z a -tzip "../../package/${{ matrix.artifact }}" ./*
                fi
              )
              ;;
          esac
          ls -la package/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: package/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten release files
        run: |
          mkdir -p release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          ls -la release/
          test "$(find release -type f | wc -l)" -gt 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: RAMA CYCLE ${{ steps.ver.outputs.tag }}
          body: |
            Walk the inner surface of Kepler Drum — a rotating space habitat.

            **Controls:** WASD move · mouse look · Space jump · Shift run · dig / install modules · Esc menu

            ### Downloads
            - **macOS** — `RamaCycle-macos.zip` (Developer ID + notarized when CI secrets are set; otherwise use `Open RAMA CYCLE.command` or System Settings → Privacy & Security → Open Anyway)
            - **Windows** — `RamaCycle-windows.zip` (SmartScreen: More info → Run anyway until reputation builds)
            - **Linux** — `RamaCycle-linux.zip` (`chmod +x` or use `Run RAMA CYCLE.sh`)
            - **Steam Deck** — `RamaCycle-deck.zip` (Linux + `deck`/`lowspec` quality defaults)
            - **Low Spec** — `RamaCycle-lowspec.zip` (Linux, foliage/LOD cut)

            See `FIRST_RUN.txt` inside each zip.

            Site: https://mhsenkow.github.io/ramen/
          files: release/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
